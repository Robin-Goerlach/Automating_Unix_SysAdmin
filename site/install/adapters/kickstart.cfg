# SASD candidate Red Hat Kickstart profile; validate against the selected release.
install
lang en_US.UTF-8
keyboard us
network --device=eth0 --bootproto=dhcp --hostname=HOSTNAME
zerombr
clearpart --none
%packages
@base
%end
%post --interpreter=/bin/sh
